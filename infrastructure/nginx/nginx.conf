worker_processes 1;

error_log logs/error.log info;
pid logs/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format infrared_agent
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_user_agent" '
        'upstream="$upstream_addr" request_time="$request_time"';

    access_log logs/access.log infrared_agent;

    upstream infrared_teamserver {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Infrared-Redirector local-nginx-v1;

        location = /redirector/health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/agent/checkin {
            proxy_pass http://infrared_teamserver;
        }

        location ~ ^/api/agent/[^/]+/(tasks|results)$ {
            proxy_pass http://infrared_teamserver;
        }

        location / {
            return 404;
        }
    }
}
