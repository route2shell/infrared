worker_processes 1;

error_log /var/log/nginx/infrared/error.log info;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    log_format infrared_agent
        '$remote_addr - $remote_user [$time_local] '
        '"$request" $status $body_bytes_sent '
        '"$http_user_agent" '
        'upstream="$upstream_addr" request_time="$request_time"';

    access_log /var/log/nginx/infrared/access.log infrared_agent;

    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name localhost;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Infrared-Redirector compose-nginx-v1;
        set $infrared_teamserver http://teamserver:8000;

        location = /redirector/health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location = /api/agent/checkin {
            proxy_pass $infrared_teamserver;
        }

        location ~ ^/api/agent/[^/]+/(tasks|results)$ {
            proxy_pass $infrared_teamserver;
        }

        location / {
            return 404;
        }
    }
}
