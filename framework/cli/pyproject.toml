[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infrared-cli"
version = "0.1.0"
description = "Infrared V1 operator CLI"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
ir = "infrared_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["infrared_cli*"]
